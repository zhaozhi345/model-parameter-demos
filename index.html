<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型参数互动演示</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#25354b}body{display:flex;flex-direction:column;background:#f4f7fb}header{padding:16px 24px;background:#fff;border-bottom:1px solid #dde4ee}h1{font-size:21px;margin:0 0 10px}.tabs{display:flex;gap:10px;flex-wrap:wrap}button{cursor:pointer;border:1px solid #c7d3e3;background:white;color:#234369;padding:10px 17px;border-radius:8px;font:inherit}button[aria-selected=true]{background:#2168c5;color:white;border-color:#2168c5}.note{font-size:14px;line-height:1.7;margin:10px 0 0;background:#fff7dc;padding:9px 12px;border-radius:6px}iframe{flex:1;width:100%;border:0;min-height:480px;background:#fff}a{color:#2168c5}@media(max-width:600px){header{padding:12px}h1{font-size:19px}.note{font-size:13px}}</style></head>
<body><header><h1>模型参数互动演示</h1><nav class="tabs" aria-label="演示切换"><button type="button" data-src="presence.html" aria-selected="true">Presence｜出现惩罚</button><button type="button" data-src="frequency.html" aria-selected="false">Frequency｜频率惩罚</button></nav>
<p class="note"><strong>怎么区分：</strong>出现惩罚看“用过没有”；频率惩罚看“用了几次”。拖滑块观察柱图，正值降低重复倾向，0不作调整，负值鼓励重复。<br>本页是教学模拟，没有调用真实大模型。下方例句预先写好，拖滑块更新柱图，不会自动生成新回复。真实模型按token处理，页面用完整词语帮助理解。</p></header>
<iframe id="demo" src="presence.html" title="出现惩罚互动演示"></iframe>
<script>const frame=document.getElementById('demo');document.querySelectorAll('[data-src]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-src]').forEach(b=>b.setAttribute('aria-selected',String(b===button)));frame.src=button.dataset.src;frame.title=button.textContent+'互动演示'}));</script></body></html>
